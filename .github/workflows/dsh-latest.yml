name: DSH latest compatibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dsh-latest.yml
      - tools/**
      - packages/dsh-plugin/**
      - packages/protocol/**
      - pnpm-lock.yaml
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Select the temporary official DSH installation directory
        run: echo "DSH_LATEST_INSTALL=$RUNNER_TEMP/starlite-dsh-official" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix "$DSH_LATEST_INSTALL" --no-audit --no-fund @deepseek-ai/dsh@latest
      - run: node tools/check-dsh-contract.mjs "$DSH_LATEST_INSTALL/node_modules/@deepseek-ai/dsh" --desktop
      - name: Verify official Desktop RPC authentication and cold service startup
        run: node tools/qualify-dsh-navigation.mjs "$DSH_LATEST_INSTALL/node_modules/@deepseek-ai/dsh"
      - name: Stage artwork-free package inputs for contract installation only
        # These header-only PE bytes are never executed. The smoke uses a missing EXE override.
        run: node tools/stage-dsh-contract-fixture.mjs
      - run: pnpm pack:plugin
      - name: Verify packed installation, authenticated boot, fail-open and disposal
        run: node tools/smoke-dsh-plugin.mjs "$DSH_LATEST_INSTALL/node_modules/@deepseek-ai/dsh"
