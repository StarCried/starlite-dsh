name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      present: ${{ steps.pin.outputs.present }}
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pin
        shell: bash
        run: |
          if [[ ! -f release/starlite.rev ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          revision="$(tr -d '\r\n' < release/starlite.rev)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:core
      - run: git diff --check

  runtime:
    needs: release-pin
    if: ${{ needs.release-pin.outputs.present == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: StarCried/starlite
          ref: ${{ needs.release-pin.outputs.revision }}
          path: starlite
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starlite/package-lock.json
      - name: Install deterministic WASM build tools
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            | awk -F: '$1 == "fpr" { print $10; exit }')" \
            = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo gpg --dearmor \
            --output /usr/share/keyrings/apt.llvm.org.gpg \
            "$RUNNER_TEMP/llvm-snapshot.gpg.key"
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install --yes lld-20
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_120/binaryen-version_120-x86_64-linux.tar.gz
          echo "ddb097af51d1bdb17300d986b0de7d97422f1933dedb4c9eda3510e0bf4076cc  $RUNNER_TEMP/binaryen.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_120/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/starlite/official-sdk
          key: official-sdk-${{ runner.os }}-${{ hashFiles('starlite/tools/official-sdk/pin.json', 'starlite/tools/official-sdk/**', 'starlite/tools/build-official-sdk.mjs') }}
      - working-directory: starlite
        run: npm ci
      - working-directory: starlite
        run: npm run fixtures && npm run build:wasm && npm run build --workspace @starcried/starlite-core && npm run build --workspace @starcried/starlite-inochi2d && npm run build --workspace @starcried/starlite-vrm && npm run test --workspace @starcried/starlite-inochi2d && npm run test --workspace @starcried/starlite-vrm
      - run: node tools/sync-model-runtime.mjs starlite/packages/inochi2d/dist
      - uses: actions/upload-artifact@v7
        with:
          name: model-runtimes
          path: apps/desktop/public/runtime
          if-no-files-found: error
          retention-days: 1

  windows-desktop:
    needs: [core, runtime]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/download-artifact@v8
        with:
          name: model-runtimes
          path: apps/desktop/public/runtime
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --release --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm desktop:build
      - name: Verify isolated NSIS install, synthetic upgrade, reinstall and uninstall
        shell: pwsh
        run: ./tools/test-installer.ps1
      - run: pnpm pack:plugin
      - run: pnpm check:release
      - name: Generate checksums, SBOM and dependency license texts
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $bridge = Get-Content -LiteralPath 'packages/dsh-plugin/package.json' -Raw | ConvertFrom-Json
          $installer = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' "$($config.productName)_$($config.version)_x64-setup.exe"
          $plugin = Join-Path 'packages/dsh-plugin/.pack' "$($bridge.name)-$($bridge.version).tgz"
          pnpm release:metadata -- $plugin $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-alpha
          # The explicitly listed plugin tarball lives in the hidden .pack directory.
          include-hidden-files: true
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/dsh-plugin/.pack/*.tgz
            release-output/SHA256SUMS
            release-output/sbom.cdx.json
            release-output/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 7
