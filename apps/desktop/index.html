<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DSH Companion</title>
  </head>
  <body>
    <main id="pet-view" aria-label="DSH Companion">
      <output id="bubble" aria-live="polite" hidden></output>
      <div id="model" aria-label="模型"></div>
      <button id="empty-model" type="button" hidden>点击此处打开设置并导入模型。</button>
    </main>

    <main id="settings-view" hidden>
      <header>
        <h1>DSH Companion</h1>
        <p>模型和会话内容仅保存在本机。</p>
      </header>
      <section>
        <h2>模型</h2>
        <div class="row">
          <button id="choose-model" type="button">选择 .inp / .vrm</button>
          <span id="model-path">尚未选择</span>
        </div>
        <div id="vrm-resources" hidden>
          <p>VRM 动作独立导入；动作名称取自文件名。</p>
          <button id="choose-animations" type="button">选择 VRMA 动作</button>
          <span id="animation-files">尚未选择动作</span>
          <p><button id="choose-profile" type="button">选择角色配置（可选）</button>
          <button id="clear-profile" type="button">使用标准 VRM</button>
          <span id="profile-file">标准 VRM</span></p>
        </div>
        <p id="inspection-status" role="status"></p>
      </section>
      <form id="settings-form">
        <section>
          <h2>动画映射</h2>
          <p id="animation-pool-help">点击回应和偶发小动作可多选：按住 Ctrl 点击增减，或按住 Shift 连选。每次随机播放一个；只让待机循环。</p>
          <div id="animation-mappings"></div>
        </section>
        <section class="preferences">
          <h2>显示</h2>
          <label>帧率
            <select id="fps"><option value="60">60 FPS</option><option value="30">30 FPS</option></select>
          </label>
          <label>渲染 DPR 上限
            <input id="dpr" type="number" min="1" max="1.5" step="0.1" />
          </label>
          <label>模型缩放
            <input id="scale" type="number" min="0.25" max="3" step="0.05" />
          </label>
          <label class="check"><input id="privacy" type="checkbox" /> 固定文案隐私模式</label>
        </section>
        <div class="actions">
          <button id="save-settings" type="submit">导入并保存</button>
        </div>
      </form>
      <p id="settings-error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
