name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      present: ${{ steps.pin.outputs.present }}
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pin
        shell: bash
        run: |
          if [[ ! -f release/starlite.rev ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          revision="$(tr -d '\r\n' < release/starlite.rev)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:core
      - run: git diff --check

  runtime:
    needs: release-pin
    if: ${{ needs.release-pin.outputs.present == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: StarCried/starlite
          ref: ${{ needs.release-pin.outputs.revision }}
          path: starlite
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starlite/package-lock.json
      - working-directory: starlite
        run: npm ci
      - working-directory: starlite
        run: npm run build --workspace @starcried/starlite-core && npm run build --workspace @starcried/starlite-vrm && npm run test --workspace @starcried/starlite-core && npm run test --workspace @starcried/starlite-vrm
      - run: node tools/sync-model-runtime.mjs starlite
      - uses: actions/upload-artifact@v7
        with:
          name: model-runtimes
          path: apps/desktop/public/runtime
          if-no-files-found: error
          retention-days: 1

  windows-desktop:
    needs: [core, runtime]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/download-artifact@v8
        with:
          name: model-runtimes
          path: apps/desktop/public/runtime
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --release --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm desktop:build
      - name: Verify isolated NSIS install, synthetic upgrade, reinstall and uninstall
        shell: pwsh
        run: ./tools/test-installer.ps1
      - name: Generate dependency notices for the embedded desktop
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $installer = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' "$($config.productName)_$($config.version)_x64-setup.exe"
          pnpm release:metadata -- $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage the unified plugin with an artwork-free local test reference
        shell: pwsh
        run: |
          # CI verifies package structure without downloading or uploading the private character.
          # This deliberately unavailable loopback reference cannot pass the public release gate.
          $descriptor = @{ title = 'CI artwork-free fixture'; url = 'http://127.0.0.1:1/fixture.vrm'; sha256 = ('0' * 64); bytes = 1; localTest = $true }
          $descriptor | ConvertTo-Json | Set-Content -LiteralPath 'release-output/ci-default-model.json' -Encoding utf8
          pnpm stage:plugin -- release-output/ci-default-model.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm pack:plugin
      - name: Check local build gates (not a public release)
        run: pnpm check:release -- --local-test
      - name: Generate checksums, SBOM and dependency license texts
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $bridge = Get-Content -LiteralPath 'packages/dsh-plugin/package.json' -Raw | ConvertFrom-Json
          $installer = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' "$($config.productName)_$($config.version)_x64-setup.exe"
          $plugin = Join-Path 'packages/dsh-plugin/.pack' "$($bridge.name)-$($bridge.version).tgz"
          pnpm release:metadata -- $plugin $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package the optional portable app and include its checksum
        shell: pwsh
        run: |
          # Packaging includes the license texts generated in the previous step.
          pnpm pack:portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = Get-Content -LiteralPath 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $bridge = Get-Content -LiteralPath 'packages/dsh-plugin/package.json' -Raw | ConvertFrom-Json
          $installer = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' "$($config.productName)_$($config.version)_x64-setup.exe"
          $plugin = Join-Path 'packages/dsh-plugin/.pack' "$($bridge.name)-$($bridge.version).tgz"
          $portable = Join-Path 'release-output' "StarLite-for-DSH_$($config.version)_x64-portable.zip"
          pnpm release:metadata -- $plugin $installer $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: local-only-windows-validation
          # The explicitly listed plugin tarball lives in the hidden .pack directory.
          include-hidden-files: true
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/dsh-plugin/.pack/*.tgz
            release-output/StarLite-for-DSH_*_x64-portable.zip
            release-output/SHA256SUMS
            release-output/sbom.cdx.json
            release-output/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 7
